<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPSRKit Pro — EU GPSR (2023/988) Technical File &amp; 5-Language Label Studio</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Compliance Studio Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="34" height="34">
            <rect width="36" height="36" rx="9" fill="#003399" />
            <circle cx="18" cy="18" r="11" fill="none" stroke="#FFCC00" stroke-width="1.35" stroke-dasharray="2.1 3.65" />
            <path d="M13 18.5l3.2 3.2L23.5 14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-row">
            <h1 class="brand-title">GPSRKit Pro</h1>
            <span id="tierBadge" class="tier-badge tier-free">FREE</span>
            <span id="offlinePill" class="offline-pill"></span>
          </div>
          <p id="appSubtitle" class="brand-subtitle"></p>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="header-readiness" id="headerReadinessPill" title="EU GPSR Readiness">
          <span class="hr-dot" id="headerReadinessDot"></span>
          <span id="headerReadinessText">100%</span>
        </div>
        <button id="licenseBtn" type="button" class="btn btn-primary btn-sm"></button>
        <button id="langBtn" type="button" class="btn btn-ghost btn-sm" aria-label="Switch Language">中文</button>
      </div>
    </header>

    <!-- 1-Click Sample Product Bar -->
    <section class="sample-bar" aria-label="Sample Products">
      <span id="sampleLabel" class="sample-bar-label"></span>
      <div class="sample-pills">
        <button type="button" class="btn btn-chip" data-sample="ceramic_mug" id="btnSampleMug"></button>
        <button type="button" class="btn btn-chip" data-sample="wooden_craft" id="btnSampleWood"></button>
        <button type="button" class="btn btn-chip" data-sample="usb_desk_lamp" id="btnSampleLamp"></button>
      </div>
    </section>

    <!-- Main 2-Column Workspace -->
    <main class="workspace">
      <!-- LEFT COLUMN: Structured Data, Risk Matrix, Warnings, Batch CSV -->
      <section class="col-editor">
        <nav class="tabs" role="tablist" aria-label="Editor Sections">
          <button type="button" class="tab active" role="tab" data-editor-tab="product" id="tabBtnProduct"></button>
          <button type="button" class="tab" role="tab" data-editor-tab="risk" id="tabBtnRisk"></button>
          <button type="button" class="tab" role="tab" data-editor-tab="warnings" id="tabBtnWarnings"></button>
          <button type="button" class="tab" role="tab" data-editor-tab="batch" id="tabBtnBatch"></button>
        </nav>

        <!-- TAB 1: Product & Economic Operators -->
        <div class="tab-panel active" id="panel-product">
          <!-- Saved Operator Profiles (Pro) -->
          <div class="card profile-card">
            <div class="card-head-inline">
              <h2 id="secProfiles" class="card-title"></h2>
              <span class="pro-tag">PRO</span>
            </div>
            <div class="profile-row">
              <select id="profileSelect" class="input"></select>
              <button type="button" id="btnSaveProfile" class="btn btn-outline btn-sm"></button>
              <button type="button" id="btnDeleteProfile" class="btn btn-ghost btn-sm"></button>
            </div>
            <p id="profileProNote" class="field-hint"></p>
          </div>

          <!-- Product Identity -->
          <div class="card">
            <h2 id="secProduct" class="card-title"></h2>
            <div class="form-grid">
              <div class="field field-full">
                <label for="fProductName" id="lblProductName"></label>
                <input id="fProductName" type="text" class="input" autocomplete="off" />
              </div>
              <div class="field">
                <label for="fSku" id="lblSku"></label>
                <input id="fSku" type="text" class="input mono" autocomplete="off" />
              </div>
              <div class="field">
                <label for="fBatchFormat" id="lblBatchFormat"></label>
                <input id="fBatchFormat" type="text" class="input mono" autocomplete="off" />
              </div>
              <div class="field">
                <label for="fEan" id="lblEan"></label>
                <input id="fEan" type="text" class="input mono" autocomplete="off" />
              </div>
              <div class="field">
                <label for="fCategory" id="lblCategory"></label>
                <div class="inline-control">
                  <select id="fCategory" class="input"></select>
                  <button type="button" id="btnApplyPreset" class="btn btn-soft btn-sm"></button>
                </div>
                <span id="lblApplyPresetHint" class="field-hint"></span>
              </div>
              <div class="field field-full">
                <label for="fMaterials" id="lblMaterials"></label>
                <textarea id="fMaterials" rows="2" class="input"></textarea>
              </div>
              <div class="field field-full">
                <label for="fIntendedUse" id="lblIntendedUse"></label>
                <textarea id="fIntendedUse" rows="2" class="input"></textarea>
              </div>
              <div class="field field-full">
                <label for="fTargetUsers" id="lblTargetUsers"></label>
                <textarea id="fTargetUsers" rows="2" class="input"></textarea>
              </div>
            </div>
          </div>

          <!-- Manufacturer -->
          <div class="card">
            <h2 id="secManufacturer" class="card-title"></h2>
            <div class="form-grid">
              <div class="field">
                <label for="fMfrName" id="lblMfrName"></label>
                <input id="fMfrName" type="text" class="input" autocomplete="off" />
              </div>
              <div class="field">
                <label for="fMfrTrade" id="lblMfrTrade"></label>
                <input id="fMfrTrade" type="text" class="input" autocomplete="off" />
              </div>
              <div class="field field-full">
                <label for="fMfrAddress" id="lblMfrAddress"></label>
                <input id="fMfrAddress" type="text" class="input" autocomplete="off" />
              </div>
              <div class="field field-full">
                <label for="fMfrContact" id="lblMfrContact"></label>
                <input id="fMfrContact" type="text" class="input mono" autocomplete="off" />
              </div>
            </div>
          </div>

          <!-- EU Responsible Person -->
          <div class="card card-accent">
            <h2 id="secEuRp" class="card-title"></h2>
            <div class="form-grid">
              <div class="field field-full">
                <label for="fRpName" id="lblRpName"></label>
                <input id="fRpName" type="text" class="input" autocomplete="off" />
              </div>
              <div class="field field-full">
                <label for="fRpAddress" id="lblRpAddress"></label>
                <input id="fRpAddress" type="text" class="input" autocomplete="off" />
              </div>
              <div class="field field-full">
                <label for="fRpContact" id="lblRpContact"></label>
                <input id="fRpContact" type="text" class="input mono" autocomplete="off" />
              </div>
            </div>
          </div>
        </div>

        <!-- TAB 2: Interactive 10-Dimension Risk Matrix -->
        <div class="tab-panel" id="panel-risk">
          <div class="card">
            <h2 id="riskMatrixTitle" class="card-title"></h2>
            <p id="riskMatrixSub" class="card-sub"></p>
            <div id="riskMatrixList" class="hazard-list"></div>
          </div>
        </div>

        <!-- TAB 3: 5-Language Safety Warning Phrasebook -->
        <div class="tab-panel" id="panel-warnings">
          <div class="card">
            <h2 id="warningsTitle" class="card-title"></h2>
            <p id="warningsSub" class="card-sub"></p>
            <div id="warningsChecklist" class="warnings-grid"></div>
            <div class="field field-full" style="margin-top:14px;">
              <label for="fCustomWarning" id="lblCustomWarning"></label>
              <input id="fCustomWarning" type="text" class="input" autocomplete="off" />
            </div>
          </div>
        </div>

        <!-- TAB 4: Batch Multi-SKU CSV -> ZIP -->
        <div class="tab-panel" id="panel-batch">
          <div class="card">
            <div class="card-head-inline">
              <h2 id="batchTitle" class="card-title"></h2>
              <span class="pro-tag">PRO</span>
            </div>
            <p id="batchSub" class="card-sub"></p>

            <div id="batchProBanner" class="banner banner-pro hidden">
              <span id="batchProBannerText"></span>
              <button type="button" class="btn btn-primary btn-xs js-open-license"></button>
            </div>

            <div class="action-bar">
              <button type="button" id="btnLoadSampleCsv" class="btn btn-soft btn-sm"></button>
              <button type="button" id="btnUploadCsv" class="btn btn-outline btn-sm"></button>
              <input type="file" id="csvFileInput" accept=".csv,.txt" class="hidden" />
              <button type="button" id="btnExportZip" class="btn btn-primary btn-sm"></button>
            </div>

            <textarea id="batchCsvInput" class="input mono csv-textarea" rows="7" spellcheck="false"></textarea>
            <div id="batchMetaRow" class="batch-meta"></div>

            <div id="batchTableWrap" class="batch-table-wrap"></div>
          </div>
        </div>
      </section>

      <!-- RIGHT COLUMN: Readiness Audit + Live Output Studio -->
      <aside class="col-output">
        <!-- Completeness Readiness Score Card -->
        <section class="card readiness-card" aria-label="GPSR Readiness">
          <div class="readiness-top">
            <div>
              <h2 id="readinessTitle" class="card-title"></h2>
              <div class="readiness-meta-row">
                <span id="readinessStatusBadge" class="status-pill status-ready"></span>
                <span id="readinessShaLine" class="sha-chip mono"></span>
              </div>
            </div>
            <div class="score-ring" id="scoreRing">
              <span id="scoreNumber">100%</span>
            </div>
          </div>

          <div class="progress-track">
            <div class="progress-fill" id="readinessBar" style="width: 100%"></div>
          </div>

          <ul id="readinessChecklist" class="readiness-list"></ul>
        </section>

        <!-- Output Studio Tabs -->
        <section class="card output-card">
          <nav class="tabs tabs-sub" role="tablist" aria-label="Output Views">
            <button type="button" class="tab active" role="tab" data-out-tab="labels" id="outTabLabels"></button>
            <button type="button" class="tab" role="tab" data-out-tab="techfile" id="outTabTechFile"></button>
            <button type="button" class="tab" role="tab" data-out-tab="marketplace" id="outTabMarketplace"></button>
          </nav>

          <!-- OUTPUT 1: Multilingual Label Sheet -->
          <div class="out-panel active" id="out-labels">
            <div class="output-toolbar">
              <div class="segmented" role="group" aria-label="Label Layout">
                <button type="button" class="seg-btn active" data-layout="a4_2x5" id="btnLayoutA4"></button>
                <button type="button" class="seg-btn" data-layout="thermal_50x30" id="btnLayoutThermal"></button>
              </div>
              <div class="lang-chips" id="labelLangChips"></div>
            </div>

            <div id="freeLabelBanner" class="banner banner-pro hidden">
              <span id="freeLabelBannerText"></span>
              <button type="button" class="btn btn-primary btn-xs js-open-license"></button>
            </div>

            <p id="thermalOverflowHint" class="field-hint hidden"></p>

            <div class="action-bar">
              <button type="button" id="btnPrintLabel" class="btn btn-primary btn-sm"></button>
              <button type="button" id="btnExportLabelHtml" class="btn btn-outline btn-sm"></button>
            </div>

            <div class="preview-frame-wrap">
              <iframe id="labelPreviewFrame" class="preview-frame" title="Multilingual Label Preview" sandbox="allow-modals allow-same-origin"></iframe>
            </div>
          </div>

          <!-- OUTPUT 2: Article 9 Technical File -->
          <div class="out-panel" id="out-techfile">
            <div id="techFileFreeBanner" class="banner banner-pro hidden">
              <span id="techFileFreeBannerText"></span>
              <button type="button" class="btn btn-primary btn-xs js-open-license"></button>
            </div>

            <div class="action-bar">
              <button type="button" id="btnPrintTechFile" class="btn btn-primary btn-sm"></button>
              <button type="button" id="btnDownloadTechHtml" class="btn btn-outline btn-sm"></button>
              <button type="button" id="btnDownloadTechJson" class="btn btn-outline btn-sm"></button>
            </div>

            <div class="preview-frame-wrap preview-tall">
              <iframe id="techFilePreviewFrame" class="preview-frame" title="Article 9 Technical File Preview" sandbox="allow-modals allow-same-origin"></iframe>
            </div>
          </div>

          <!-- OUTPUT 3: Amazon / Etsy / Shopify Compliance Copy -->
          <div class="out-panel" id="out-marketplace">
            <div class="mp-bar">
              <div class="segmented" role="group" aria-label="Marketplace Channel">
                <button type="button" class="seg-btn active" data-mp="amazon" id="btnMpAmazon"></button>
                <button type="button" class="seg-btn" data-mp="etsy" id="btnMpEtsy"></button>
                <button type="button" class="seg-btn" data-mp="shopify" id="btnMpShopify"></button>
              </div>
              <button type="button" id="btnCopyMp" class="btn btn-primary btn-sm"></button>
            </div>
            <p id="mpFreeIncluded" class="field-hint"></p>
            <textarea id="mpCopyOutput" class="input mono mp-textarea" rows="18" readonly spellcheck="false"></textarea>
          </div>
        </section>
      </aside>
    </main>

    <!-- Legal Boundary Footer -->
    <footer class="footer">
      <p id="footerDisclaimer"></p>
    </footer>
  </div>

  <!-- License Activation Modal -->
  <div id="licenseModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalLicenseTitle">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h2 id="modalLicenseTitle" class="modal-title"></h2>
          <p id="modalLicenseSub" class="modal-sub"></p>
        </div>
        <button type="button" id="btnCloseModalX" class="icon-close" aria-label="Close">×</button>
      </div>

      <div id="licenseActiveBox" class="banner banner-success hidden"></div>

      <div class="field field-full">
        <label for="licenseKeyInput" id="lblLicenseKey"></label>
        <input id="licenseKeyInput" type="text" class="input mono" autocomplete="off" />
      </div>

      <div id="licenseFeedback" class="license-feedback hidden"></div>

      <div class="modal-actions">
        <button type="button" id="btnActivateLicense" class="btn btn-primary"></button>
        <button type="button" id="btnClearLicense" class="btn btn-ghost hidden"></button>
        <button type="button" id="btnCloseModal" class="btn btn-outline"></button>
      </div>

      <div class="modal-store-links">
        <a id="linkBuyGumroad" class="btn btn-soft btn-sm" target="_blank" rel="noopener noreferrer"></a>
        <a id="linkBuyMbd" class="btn btn-outline btn-sm" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
